<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live overview · 30+DA Super admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=JetBrains+Mono:wght@400..600&display=swap">
  <link rel="stylesheet" href="/30da/admin/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-row">
      <span class="wordmark">30+DA</span>
      <span class="pill">Super admin</span>
    </div>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="m9.5 9.5 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Search users by name or ID" aria-label="Search users by name or ID">
    </label>
    <span class="live"><span class="dot"></span>LIVE</span>
    <button class="link signout" id="signout" type="button">Sign out</button>
  </header>

  <div class="shell">
    <nav class="sidenav" aria-label="Sections">
      <button class="navitem active" data-target="top" type="button">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="8" y="1.5" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="1.5" y="8" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="8" y="8" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.3"/></svg>
        Live overview
      </button>
      <button class="navitem" data-target="users" type="button">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="5" cy="4.5" r="2.3" stroke="currentColor" stroke-width="1.3"/><path d="M1 12c.4-2.2 2-3.4 4-3.4s3.6 1.2 4 3.4M9.5 2.4a2.2 2.2 0 0 1 0 4.2M10.8 8.8c1.2.4 2 1.5 2.2 3.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Users
      </button>
      <button class="navitem" data-target="monitor" type="button">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2 11.8 2.8 9A5 5 0 1 1 5 11.3L2 11.8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        Chat monitor
        <span class="badge" id="nav-badge" hidden></span>
      </button>
      <a class="navitem" href="/30da/admin/questions">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.6" stroke="currentColor" stroke-width="1.3"/><path d="M5.4 5.5a1.7 1.7 0 1 1 2.4 1.5c-.5.3-.8.6-.8 1.2v.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="7" cy="10.2" r=".75" fill="currentColor"/></svg>
        Questions
      </a>
      <a class="navitem" href="/30da/admin/connections">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="4.6" cy="9.4" r="2.7" stroke="currentColor" stroke-width="1.3"/><path d="M6.5 7.5 12.2 1.8M10.4 3.6l1.5 1.5M8.8 5.2l1.2 1.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Code
      </a>
      <a class="navitem" href="/30da/admin/support">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.6" stroke="currentColor" stroke-width="1.3"/><circle cx="7" cy="7" r="2.3" stroke="currentColor" stroke-width="1.3"/><path d="m3 3 2.4 2.4M11 3 8.6 5.4M3 11l2.4-2.4M11 11 8.6 8.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Support
        <span class="badge" id="support-badge" hidden></span>
      </a>
      <a class="navitem" href="/30da/admin/review">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><rect x="3.2" y="1.2" width="7.6" height="11.6" rx="1.6" stroke="currentColor" stroke-width="1.3"/><path d="m5.2 7 1.3 1.3 2.4-2.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        App review
      </a>
    </nav>

    <main class="main" id="top">
      <div class="head">
        <h1>Live overview</h1>
        <span class="label" id="updated">Live · loading…</span>
      </div>

      <section class="stats" aria-label="Live counts">
        <div class="stat dark"><div class="label">Online now</div><div class="num" id="s-online">–</div></div>
        <div class="stat"><div class="label">Level 3 chats</div><div class="num" id="s-l3">–</div></div>
        <div class="stat alert"><div class="label">Open flags</div><div class="num" id="s-flags">–</div></div>
        <div class="stat"><div class="label">Blocked</div><div class="num" id="s-blocked">–</div></div>
        <a class="review-note label" id="s-review" href="/30da/admin/review"></a>
      </section>

      <div class="cols">
        <section class="panel" id="users" aria-labelledby="users-title">
          <div class="panel-head">
            <h2 id="users-title">Users in use</h2>
            <div class="chips" id="filters" role="group" aria-label="Filter users"></div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="label">User</th><th class="label">Level</th><th class="label" title="Birth year (set once at sign-up)">Born</th><th class="label">Language</th>
                  <th class="label">Area</th><th class="label">Status</th><th class="label">Flags</th><th class="label">Actions</th>
                </tr>
              </thead>
              <tbody id="user-rows"></tbody>
            </table>
          </div>
          <p class="empty" id="no-users" hidden>No users match.</p>
        </section>

        <section class="panel monitor" id="monitor" aria-labelledby="monitor-title">
          <div class="panel-head">
            <h2 id="monitor-title">Chat monitor</h2>
            <div class="seg" role="tablist">
              <button type="button" role="tab" id="tab-queue" class="active" aria-selected="true">Flag queue · <span id="q-count">0</span></button>
              <button type="button" role="tab" id="tab-log" aria-selected="false">Chat log</button>
            </div>
          </div>
          <div class="scroll" id="monitor-body"></div>
        </section>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/30da/admin/support-badge.js" defer></script>
  <script src="/30da/admin/delete-profile.js"></script>
  <script src="/30da/admin/monitor.js"></script>
</body>
</html>
